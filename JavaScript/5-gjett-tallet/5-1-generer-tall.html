<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Math.random() gir tilfeldig tall mellom 0 og 1
        let tallA = Math.random();
        let tallB = Math.random() * 6;
        let tallCeil = Math.ceil(tallB);
        let tallFloor = Math.floor(tallB);

        document.write(`<p>tallA = ${tallA} </p>`);
        document.write(`<p>tallB = ${tallB} </p>`);
        document.write(`<p>tallCeil = ${tallCeil} </p>`);
        document.write(`<p>tallFloor = ${tallFloor} </p>`);

    </script>
</body>
</html>
