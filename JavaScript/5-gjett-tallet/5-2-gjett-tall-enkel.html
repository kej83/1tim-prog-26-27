<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <h1>Gjett tallet (1-3)</h1>
    <input id="inpGjett" type="number" min="1" max="3">
    <button onclick="gjett()">Gjett</button>
    <p id="txtUt"></p>

    <script>
        function gjett() {
            // 0. fjern tidligere tekst i txtUt-feltet.
            txtUt.textContent = "";
        
            // 1. Lag et tilfeldig tall 1-3
            let fasit = Math.ceil(Math.random() * 3);
            
            // 2. Les inn brukerens svar
            let gjett = Number(inpGjett.value);

            // 3. Sjekk mot fasit
            if (gjett == fasit) {
                txtUt.textContent = "Du gjettet riktig! Hurra!";
            }

        }
    </script>

</body>
</html>
