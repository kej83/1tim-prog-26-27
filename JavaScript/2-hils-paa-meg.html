<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Personlig hilsen</h1>

    <input type="text">
    <button onclick="hils()">Hils på meg</button>

    <script>
        // HER begynner JavaScript
        function hils() {
            // Dette skjer når knappen trykkes
            // 1. Les inn navn fra input-element
            let navn = document.querySelector("input").value;
            // 2. Lag hilsen med variabelen navn
            document.write("Morn, " + navn);
        }
    </script>


</body>
</html>
