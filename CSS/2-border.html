<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            background-color: pink;
            border-style: dashed;
            color:blue;
            border-color:brown;
        }
        h2 {
            border-style: solid;
        }
        img {
            border-style: dotted;
            border-width: 10px;
        }
        h3 {
            border-left-style: solid;
            border-width: 5px;
        }
    </style>
</head>
<body>
    <h1>Borders</h1>
    <h2>Solid border</h2>
    <h3>Left border</h3>

    <p>Dotted border med width 10px</p>
    <img src="https://picsum.photos/200" alt="">
</body>
</html>
